<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarang Register</title>
</head>

<body>

<form action="list.html" method="post">

    <center>
        <h1>Tarang Register</h1>
    </center>

    <label>Name</label><br>
    <input type="text" name="name" placeholder="Enter name">
    <br><br>

    <label>Department</label><br>
    <input type="text" name="department" placeholder="Enter department">
    <br><br>

    <label>College Name</label><br>
    <input type="text" name="college" placeholder="Enter college name">
    <br><br>

    <label>Course / Year</label><br>
    <input type="text" name="course" placeholder="Enter course and year">
    <br><br>

    <hr>

    <h2>Personal Details</h2>

    <label>Email</label><br>
    <input type="email" name="email" placeholder="Enter email">
    <br><br>

    <label>Phone Number</label><br>
    <input type="number" name="phone" placeholder="Enter phone number">
    <br><br>

    <label>Date of Birth</label><br>
    <input type="date" name="dob">
    <br><br>

    <label>Gender</label><br><br>

    <input type="radio" value="male" name="gender"> Male
    <input type="radio" value="female" name="gender"> Female
    <input type="radio" value="other" name="gender"> Other

    <br><br>

    <label>Address</label><br>
    <textarea name="address" rows="4" cols="40"
        placeholder="Enter your address"></textarea>
    <br><br>

    <label>City</label><br>
    <input type="text" name="city" placeholder="Enter city">
    <br><br>

    <label>State</label><br>
    <input type="text" name="state" placeholder="Enter state">
    <br><br>

    <label>Pincode</label><br>
    <input type="number" name="pincode" placeholder="Enter pincode">
    <br><br>

    <hr>

    <h2>Event Details</h2>

    <label>Select Event</label><br>
    <select name="events">
        <option value="solo song">Solo Song</option>
        <option value="singing">Singing</option>
        <option value="dance">Dance</option>
        <option value="painting">Painting</option>
    </select>

    <br><br>

    <label>Choose Your Favorite Color</label><br>
    <input type="color" name="color">

    <br><br>

    <h2>Payment Details</h2>

    <label>Payment</label><br>
    <input type="radio" name="pay" value="online"> Online
    <input type="radio" name="pay" value="offline"> Offline

    <br><br>

    <label>Upload Payment Screenshot</label><br>
    <input type="file" name="payment" accept="image/*">

    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
